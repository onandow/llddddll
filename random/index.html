<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>随机🍌工具</title>
    <!-- 香蕉 Emoji Icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍌</text></svg>">
    <style>
        :root {
            /* 日间模式 */
            --bg-gradient: linear-gradient(135deg, #edeef2 0%, #e2e4e9 100%);
            --card-bg: #ffffff;
            --card-border: #e2e5ec;
            --card-shadow: rgba(15, 23, 42, 0.05);
            --text-main: #242933;
            --text-muted: #5e6676;
            --title-color: #1a1e26;
            --icon-btn-bg: #ffffff;
            --icon-btn-border: #d4d8e2;
            --roll-btn-bg: #810000;
            --roll-btn-active: #660000;
            --roll-btn-shadow: rgba(129, 0, 0, 0.32);
            --table-th-bg: #2b303c;
            --table-th-text: #f1f3f7;
            --table-border: #e9ecf2;
            --input-bg: #ffffff;
            --input-border: #cfd4df;
            --io-btn-bg: #edf0f5;
            --io-btn-text: #3d4452;
            --io-btn-border: #d4d9e3;
            --accent-btn-bg: #e5edf5;
            --accent-btn-text: #2c3e50;
            --footer-text: #8b93a3;
        }

        body.dark-mode {
            /* 深夜模式 */
            --bg-gradient: #121316;
            --card-bg: #1a1c22;
            --card-border: #2c303a;
            --card-shadow: rgba(0, 0, 0, 0.45);
            --text-main: #f0f2f5;
            --text-muted: #bcc2ce;
            --title-color: #ffffff;
            --icon-btn-bg: #22252e;
            --icon-btn-border: #363b47;
            --roll-btn-bg: #810000;
            --roll-btn-active: #5e0000;
            --roll-btn-shadow: rgba(129, 0, 0, 0.45);
            --table-th-bg: #232731;
            --table-th-text: #ffffff;
            --table-border: #282c37;
            --input-bg: #22252e;
            --input-border: #3c4250;
            --io-btn-bg: #252832;
            --io-btn-text: #e2e6ee;
            --io-btn-border: #393e4d;
            --accent-btn-bg: #28303d;
            --accent-btn-text: #8ec3f8;
            --footer-text: #788194;
        }

        /* 全局基础设置 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 10px;
            margin: 0;
            min-height: 100vh;
        }

        /* 标题栏 */
        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 15px 0 20px 0;
            padding: 0 45px 0 45px;
        }
        .title-wrapper h2 {
            color: var(--title-color);
            margin: 0;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.35;
            text-align: center;
        }
        
        .header-left {
            position: absolute;
            left: 5px;
            display: flex;
        }

        .header-actions {
            position: absolute;
            right: 5px;
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            font-size: 18px;
            cursor: pointer;
            background: var(--icon-btn-bg);
            border-radius: 9px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--card-shadow);
            border: 1px solid var(--icon-btn-border);
            color: var(--text-main);
            user-select: none;
        }
        .icon-btn:hover {
            filter: brightness(1.15);
        }

        /* 转盘区域 */
        #wheel-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-bottom: 16px;
        }
        .wheel-box {
            position: relative;
            width: 340px;
            height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #wheelCanvas {
            width: 340px;
            height: 340px;
            border-radius: 50%;
            box-shadow: 0 8px 24px var(--card-shadow);
        }
        /* 顶部指针 */
        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 28px solid #c9382b;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.35));
            z-index: 10;
        }
        .wheel-center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 4px solid #810000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 5;
        }

        /* 主抽取按钮 */
        .btn-group { width: 100%; max-width: 500px; margin-bottom: 12px; }
        #rollBtn {
            width: 100%; padding: 15px; font-size: 18px; font-weight: 700; color: #fff;
            background: var(--roll-btn-bg);
            border: none; border-radius: 12px;
            box-shadow: 0 4px 15px var(--roll-btn-shadow);
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s ease, background-color 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 1px;
        }
        #rollBtn:active { 
            transform: scale(0.985); 
            background: var(--roll-btn-active);
        }
        #rollBtn.btn-stop {
            background: #d97706 !important;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.45) !important;
        }

        /* 容器卡片 */
        .card-container {
            width: 100%; max-width: 500px; 
            background: var(--card-bg); 
            padding: 14px;
            border-radius: 14px; 
            box-shadow: 0 6px 18px var(--card-shadow); 
            margin-bottom: 12px;
            border: 1px solid var(--card-border);
        }

        /* 结果卡片 */
        .modifier-result {
            font-size: 19px; font-weight: 700; padding: 16px;
            border-radius: 10px; text-align: center; min-height: 60px; 
            display: flex; align-items: center; justify-content: center;
            letter-spacing: 0.5px;
        }
        .mod-none { 
            color: var(--text-muted); 
            background-color: var(--input-bg); 
            border: 1px solid var(--card-border); 
            font-weight: 500; font-size: 15px; 
        }

        /* 配置面板 */
        #config-container { display: none; }
        .setting-block { margin-bottom: 12px; }
        .setting-title { font-weight: 700; color: var(--text-main); font-size: 13px; }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 36px;
            margin-bottom: 8px;
        }
        .setting-row:last-child { margin-bottom: 0; }
        .setting-row input[type="number"] { 
            width: 60px; height: 32px; 
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border); 
            border-radius: 6px; text-align: center; font-size: 13px; font-weight: 600;
        }
        .setting-row .setting-ctrl {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            min-height: 32px;
            font-size: 13px;
            font-weight: 600;
        }
        .setting-row label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
            color: var(--text-main);
        }

        /* 表格滚动容器 */
        .config-table-scroll {
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            background: var(--card-bg);
            margin-top: 8px;
        }

        .config-table { width: 100%; border-collapse: collapse; }
        .config-table th { background: var(--table-th-bg); color: var(--table-th-text); padding: 8px 4px; font-size: 12px; position: sticky; top: 0; z-index: 1; }
        .config-table td { padding: 6px 4px; border-bottom: 1px solid var(--table-border); }
        .config-table input, .config-table select { 
            width: 100%; 
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border); 
            border-radius: 4px; padding: 6px; font-size: 13px; 
        }
        
        .color-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }

        .action-btns { display: flex; gap: 8px; margin-top: 10px; }
        .add-btn { flex: 1; background: var(--accent-btn-bg); color: var(--accent-btn-text); padding: 9px; border-radius: 7px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; }
        .clear-all-btn { flex: 1; background: rgba(220, 38, 38, 0.15); color: #f87171; padding: 9px; border-radius: 7px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; }
        .save-btn { flex: 1; background: #810000; color: #fff; padding: 9px; border-radius: 7px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; }

        .io-btns { display: flex; gap: 6px; margin-top: 8px; }
        .io-btn { 
            flex: 1; 
            background: var(--io-btn-bg); 
            color: var(--io-btn-text); 
            padding: 8px; border-radius: 6px; font-size: 11px; font-weight: 600; 
            border: 1px solid var(--io-btn-border); 
            cursor: pointer; 
        }
        .io-btn:hover { filter: brightness(1.15); }

        /* 历史记录 */
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .history-header h3 { font-size: 14px; margin: 0; color: var(--title-color); font-weight: 700; }
        #clearBtn { background-color: #810000; color: white; padding: 4px 10px; border-radius: 5px; font-size: 11px; border: none; cursor: pointer; font-weight: 600; }

        .history-scroll { width: 100%; border-radius: 8px; border: 1px solid var(--card-border); overflow: hidden; }
        .history-table { width: 100%; border-collapse: collapse; background: var(--card-bg); }
        .history-table th { background-color: var(--table-th-bg); color: var(--table-th-text); padding: 9px; font-size: 12px; font-weight: 600; }
        .history-table td { padding: 9px; font-size: 13px; border-bottom: 1px solid var(--table-border); text-align: center; }
        
        .settings-footer { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--card-border); font-size: 11px; color: var(--footer-text); text-align: center; }

        /* Toast 提示 */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #252832;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--card-border);
            z-index: 10000;
            transition: opacity 0.2s;
            letter-spacing: 0.4px;
            pointer-events: none;
            white-space: nowrap;
        }

        .io-btns + .io-btns { margin-top: 6px; }

        /* 提醒文字 */
        .reminder-text {
            color: #b91c1c;
            text-align: center;
            margin: 10px 0 4px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
        }
        body.dark-mode .reminder-text {
            color: #f87171;
        }
    </style>
</head>
<body>

    <div class="title-wrapper">
        <div class="header-left">
            <div class="icon-btn" id="modeBtn" onclick="toggleWheelMode()" title="切换转盘/随机模式">🍌</div>
        </div>
        <h2>在冰箱里随便拿出一个…</h2>
        <div class="header-actions">
            <div class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换夜间模式">🌙</div>
            <div class="icon-btn" onclick="toggleConfig()" title="打开设置">⚙️</div>
        </div>
    </div>

    <!-- 转盘模式展示区域 -->
    <div id="wheel-container">
        <div class="wheel-box">
            <div class="wheel-pointer"></div>
            <canvas id="wheelCanvas" width="680" height="680"></canvas>
            <div class="wheel-center-dot"></div>
        </div>
    </div>

    <div class="btn-group">
        <button id="rollBtn" onclick="handleRollButtonClick()">Gacha!!</button>
    </div>

    <div class="card-container">
        <div id="res-modifier" class="modifier-result mod-none">【等待抽取】</div>
    </div>

    <div class="card-container" id="config-container">
        <div class="setting-block">
            <div class="setting-row">
                <span class="setting-title">防重复次数</span>
                <div class="setting-ctrl"><input type="number" id="antiRepeatLimitInput" value="10" min="0">&nbsp;次</div>
            </div>
            <div class="setting-row">
                <span class="setting-title">语音功能</span>
                <div class="setting-ctrl">
                    <label>
                        <input type="checkbox" id="ttsToggle" checked> 启用朗读
                    </label>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-title">词条权重</span>
                <div class="setting-ctrl">
                    <label>
                        <input type="checkbox" id="useWeightToggle" onchange="toggleWeightUI()"> 启用权重
                    </label>
                </div>
            </div>
        </div>
        
        <div class="setting-block" style="margin-top: 10px;">
            <span class="setting-title">词条列表</span>
            <div style="overflow-x:auto;" class="config-table-scroll">
                <table class="config-table">
                    <thead>
                        <tr>
                            <th width="10%">#</th>
                            <th>词条描述</th>
                            <th width="22%" id="weightTh">权重</th>
                            <th width="12%">删</th>
                        </tr>
                    </thead>
                    <tbody id="modifierTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="action-btns">
            <button class="add-btn" onclick="addRow()">+ 新增</button>
            <button class="clear-all-btn" onclick="clearAllConfig()">清空配置</button>
            <button class="save-btn" onclick="saveConfig()">保存设置</button>
        </div>
        <div class="reminder-text">记得保存 记得保存 记得保存</div>

        <div class="setting-block" style="margin-top:12px; margin-bottom:0;">
            <textarea id="bulkText" rows="4" style="width:100%; background:var(--input-bg); color:var(--text-main); border:1px solid var(--input-border); border-radius:6px; padding:8px; font-size:12px; line-height:1.5; resize:vertical;" placeholder="在此粘贴多行文本（每行一个选项）。&#10;导入时会自动去除开头的序号（如 '1. '）"></textarea>
            <button class="io-btn" onclick="bulkImportText()" style="width:100%; margin-top:6px; background:var(--accent-btn-bg); color:var(--accent-btn-text); border:none; padding:8px; font-weight:bold; font-size:12px;">📋 文本覆盖导入</button>
        </div>

        <div style="margin-top:10px; border-top:1px solid var(--card-border); padding-top:10px;">
            <div class="io-btns">
                <button class="io-btn" onclick="exportConfig()">复制配置</button>
                <button class="io-btn" onclick="importConfig()">粘贴导入</button>
            </div>
            <div class="io-btns">
                <button class="io-btn" onclick="exportToFile()">📁 导出成文件</button>
                <button class="io-btn" onclick="importFromFile()">📂 从文件导入</button>
            </div>
        </div>

        <div class="settings-footer">Created by R @1203605850</div>
    </div>

    <!-- 镜像页面按钮 -->
    <div style="width: 100%; max-width: 500px; text-align: right; margin-bottom: 8px;">
        <button onclick="toggleMirror()" class="io-btn" style="padding: 5px 12px; font-size: 11px; flex: initial;">🦭 镜像页面</button>
    </div>

    <div class="card-container">
        <div class="history-header">
            <h3>最近记录</h3>
            <button id="clearBtn" onclick="clearHistory()">清空</button>
        </div>
        <div class="history-scroll">
            <table class="history-table">
                <thead>
                    <tr><th width="30%">时间</th><th width="70%">抽取结果</th></tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // 基于 Pantone 色卡提取的 10 色标准配色体系
        const pantonePalette = [
            { bg: '#B8E2F2', text: '#114B60', border: '#84BFD4' }, 
            { bg: '#F9C8BE', text: '#5D2418', border: '#DDA094' }, 
            { bg: '#BA2B65', text: '#FFFFFF', border: '#871644' }, 
            { bg: '#00599D', text: '#FFFFFF', border: '#003E6E' }, 
            { bg: '#F6B343', text: '#472B00', border: '#C78923' }, 
            { bg: '#7B9DB5', text: '#FFFFFF', border: '#57788F' }, 
            { bg: '#0F6C79', text: '#FFFFFF', border: '#074852' }, 
            { bg: '#82634F', text: '#FFFFFF', border: '#5C4333' }, 
            { bg: '#79347E', text: '#FFFFFF', border: '#531B57' }, 
            { bg: '#C9382B', text: '#FFFFFF', border: '#942217' }  
        ];

        let antiRepeatLimit = 10;
        let enableTTS = true;
        let useWeight = true;
        let isDarkMode = false;
        let isWheelMode = false;

        let modifiers = [
            { text: '问题1', weight: 1 },
            { text: '问题2', weight: 1 },
            { text: '问题3', weight: 1 }
        ];

        let recentHistory = [];
        let historyLogs = [];

        // 转盘动效相关控制变量
        let currentWheelAngle = 0;
        let wheelState = 'idle';
        let spinSpeed = 0;
        let animFrameId = null;
        let pendingResult = null;

        function getCurrentPalette() {
            return pantonePalette;
        }

        window.onload = () => {
            const savedModifiers = localStorage.getItem('challenge_modifiers_v7');
            const savedUseWeight = localStorage.getItem('challenge_use_weight_v7');
            const savedAntiRepeat = localStorage.getItem('challenge_anti_repeat_v7');
            const savedTTS = localStorage.getItem('challenge_tts_v7');
            const savedDark = localStorage.getItem('challenge_dark_mode_v7');
            const savedWheelMode = localStorage.getItem('challenge_wheel_mode_v7');
            const savedHistory = localStorage.getItem('challenge_history_records_v7');

            if (savedModifiers) modifiers = JSON.parse(savedModifiers);
            if (savedUseWeight !== null) useWeight = (savedUseWeight === 'true');
            if (savedAntiRepeat !== null) antiRepeatLimit = parseInt(savedAntiRepeat, 10);
            if (savedTTS !== null) enableTTS = (savedTTS === 'true');
            if (savedDark !== null) isDarkMode = (savedDark === 'true');
            if (savedWheelMode !== null) isWheelMode = (savedWheelMode === 'true');

            if (savedHistory) {
                try {
                    historyLogs = JSON.parse(savedHistory);
                    renderHistoryTable();
                    if (antiRepeatLimit > 0) {
                        recentHistory = historyLogs.slice(0, antiRepeatLimit).map(item => item.text).reverse();
                    }
                } catch(e) {
                    historyLogs = [];
                }
            }

            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                document.getElementById('themeBtn').innerText = '☀️';
            }

            document.getElementById('useWeightToggle').checked = useWeight;
            document.getElementById('ttsToggle').checked = enableTTS;
            document.getElementById('antiRepeatLimitInput').value = antiRepeatLimit;

            updateModeUI();
            renderTable();
            drawWheel();
        };

        function toggleWheelMode() {
            if (wheelState !== 'idle') return;
            isWheelMode = !isWheelMode;
            localStorage.setItem('challenge_wheel_mode_v7', isWheelMode);
            updateModeUI();
            if (isWheelMode) {
                drawWheel();
            }
        }

        function updateModeUI() {
            const modeBtn = document.getElementById('modeBtn');
            const wheelContainer = document.getElementById('wheel-container');
            const rollBtn = document.getElementById('rollBtn');

            if (isWheelMode) {
                modeBtn.innerText = '🦭';
                modeBtn.title = '当前为转盘模式，点击切换为直接随机';
                wheelContainer.style.display = 'flex';
                rollBtn.innerText = 'Gacha!!';
            } else {
                modeBtn.innerText = '🍌';
                modeBtn.title = '当前为直接随机，点击切换为转盘模式';
                wheelContainer.style.display = 'none';
                rollBtn.innerText = 'Gacha!!';
                rollBtn.classList.remove('btn-stop');
            }
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                document.getElementById('themeBtn').innerText = '☀️';
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('themeBtn').innerText = '🌙';
            }
            localStorage.setItem('challenge_dark_mode_v7', isDarkMode);
            renderTable();
            drawWheel();
            renderHistoryTable();
        }

        function showToast(msg, duration = 3000) {
            const existing = document.querySelector('.toast-message');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast-message';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, duration);
        }

        function toggleConfig() {
            const c = document.getElementById('config-container');
            const willShow = (c.style.display !== 'block'); 
            c.style.display = willShow ? 'block' : 'none';
            if (willShow) {
                setTimeout(() => {
                    const scrollDiv = document.querySelector('.config-table-scroll');
                    if (scrollDiv) scrollDiv.scrollTop = scrollDiv.scrollHeight;
                }, 10);
            }
        }

        function toggleWeightUI() {
            useWeight = document.getElementById('useWeightToggle').checked;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('modifierTableBody');
            tbody.innerHTML = '';
            const palette = getCurrentPalette();
            
            document.getElementById('weightTh').style.display = useWeight ? 'table-cell' : 'none';

            modifiers.forEach((mod, index) => {
                const colors = palette[index % palette.length];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-align:center; font-weight:600; color:var(--text-muted);">${index+1}</td>
                    <td><div style="display:flex;align-items:center;"><span class="color-dot" style="background-color:${colors.bg}; border:1px solid ${colors.border};"></span>
                    <input type="text" value="${mod.text.replace(/"/g, '&quot;')}" class="mod-text"></div></td>
                    <td style="${useWeight ? '' : 'display:none;'}"><select class="mod-weight">
                        <option value="1" ${mod.weight==1?'selected':''}>1</option>
                        <option value="2" ${mod.weight==2?'selected':''}>2</option>
                        <option value="3" ${mod.weight==3?'selected':''}>3</option>
                    </select></td>
                    <td style="text-align:center;"><span style="color:#f87171;font-size:18px;cursor:pointer;" onclick="removeRow(${index})">×</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function syncTableToModifiers() {
            const texts = document.querySelectorAll('.mod-text');
            const weights = document.querySelectorAll('.mod-weight');
            const currentMods = [];
            for(let i = 0; i < texts.length; i++) {
                currentMods.push({ 
                    text: texts[i].value,               
                    weight: parseInt(weights[i].value) 
                });
            }
            modifiers = currentMods;
        }

        function addRow() {
            syncTableToModifiers();                     
            modifiers.push({ text: '', weight: 1 });
            renderTable();
            drawWheel();

            setTimeout(() => {
                const scrollDiv = document.querySelector('.config-table-scroll');
                if (scrollDiv) scrollDiv.scrollTop = scrollDiv.scrollHeight;
            }, 10);
        }

        function removeRow(index) {
            syncTableToModifiers();                     
            modifiers.splice(index, 1);                 
            renderTable();
            drawWheel();
        }

        function clearAllConfig() {
            if(confirm("确定要清空所有填写的词条吗？")) {
                modifiers = [];
                renderTable();
                drawWheel();
            }
        }

        function bulkImportText() {
            const txt = document.getElementById('bulkText').value;
            if (!txt.trim()) {
                showToast("⚠️ 请先在文本框内粘贴内容");
                return;
            }
            if (!confirm("确定要用文本框里的内容覆盖当前的全部词条吗？")) return;

            const lines = txt.split('\n');
            modifiers = [];

            lines.forEach(line => {
                let cleanedLine = line.replace(/^\s*\d+\.\s*/, '').trim();
                if (cleanedLine) {
                    modifiers.push({ text: cleanedLine, weight: 1 });
                }
            });

            document.getElementById('bulkText').value = '';
            renderTable();
            saveConfig(false);
            drawWheel();
            showToast(`✅ 成功导入 ${modifiers.length} 个词条！`);
            
            const scrollDiv = document.querySelector('.config-table-scroll');
            if (scrollDiv) scrollDiv.scrollTop = 0;
        }

        function saveConfig(closePanel = true) {
            antiRepeatLimit = Math.max(0, parseInt(document.getElementById('antiRepeatLimitInput').value, 10) || 0);
            enableTTS = document.getElementById('ttsToggle').checked;
            useWeight = document.getElementById('useWeightToggle').checked;
            
            const texts = document.querySelectorAll('.mod-text');
            const weights = document.querySelectorAll('.mod-weight');
            const newMod = [];
            for(let i = 0; i < texts.length; i++) { 
                const val = texts[i].value.trim();
                if (val !== "") newMod.push({ text: val, weight: parseInt(weights[i].value) });
            }
            modifiers = newMod;

            if (recentHistory.length > antiRepeatLimit) {
                recentHistory = recentHistory.slice(-antiRepeatLimit);
            }

            localStorage.setItem('challenge_anti_repeat_v7', antiRepeatLimit);
            localStorage.setItem('challenge_tts_v7', enableTTS);
            localStorage.setItem('challenge_modifiers_v7', JSON.stringify(modifiers));
            localStorage.setItem('challenge_use_weight_v7', useWeight);
            renderTable();                     
            drawWheel();

            showToast('✓ 保存完毕', 2500);
            if(closePanel) {
                document.getElementById('config-container').style.display = 'none';
            }
        }

        function exportConfig() {
            const compactData = { 
                w: useWeight,
                ar: antiRepeatLimit,
                tts: enableTTS,
                m: modifiers.map(({ text, weight }) => [text, weight]) 
            };
            const jsonStr = JSON.stringify(compactData);
            const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
            const el = document.createElement("textarea");
            el.value = encoded;
            document.body.appendChild(el);
            el.select();
            document.execCommand("copy");
            document.body.removeChild(el);
            showToast("📋 已复制配置");
        }

        function importConfig() {
            const str = prompt("粘贴配置："); 
            if (!str) return;
            try {
                const raw = JSON.parse(decodeURIComponent(escape(atob(str))));
                
                if (Array.isArray(raw.m)) {
                    modifiers = raw.m.map(item => ({ text: item[0], weight: item[1] }));
                    if(raw.w !== undefined) useWeight = raw.w;
                    if(raw.ar !== undefined) antiRepeatLimit = raw.ar;
                    if(raw.tts !== undefined) enableTTS = raw.tts;
                } else if (Array.isArray(raw.modifiers)) {
                    modifiers = raw.modifiers;
                } else {
                    throw new Error('格式无法解析');
                }

                document.getElementById('useWeightToggle').checked = useWeight;
                document.getElementById('ttsToggle').checked = enableTTS;
                document.getElementById('antiRepeatLimitInput').value = antiRepeatLimit;

                renderTable();
                saveConfig(); 
            } catch (e) {
                alert("无效配置或解析失败");
            }
        }

        function exportToFile() {
            const compactData = { 
                w: useWeight,
                ar: antiRepeatLimit,
                tts: enableTTS,
                m: modifiers.map(({ text, weight }) => [text, weight]) 
            };
            const jsonStr = JSON.stringify(compactData, null, 2); 
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `抽取配置_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('📥 配置文件已下载', 2500);
        }

        function importFromFile() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.json,application/json';
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);

            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) {
                    document.body.removeChild(fileInput);
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const raw = JSON.parse(ev.target.result);
                        if (Array.isArray(raw.m)) {
                            modifiers = raw.m.map(item => ({ text: item[0], weight: item[1] }));
                            if(raw.w !== undefined) useWeight = raw.w;
                            if(raw.ar !== undefined) antiRepeatLimit = raw.ar;
                            if(raw.tts !== undefined) enableTTS = raw.tts;
                        } else if (Array.isArray(raw.modifiers)) {
                            modifiers = raw.modifiers;
                        }

                        document.getElementById('useWeightToggle').checked = useWeight;
                        document.getElementById('ttsToggle').checked = enableTTS;
                        document.getElementById('antiRepeatLimitInput').value = antiRepeatLimit;

                        renderTable();
                        saveConfig();  
                        showToast('📂 配置已导入并保存', 3000);
                    } catch (err) {
                        alert('解析文件失败');
                    } finally {
                        document.body.removeChild(fileInput);
                    }
                };
                reader.readAsText(file);
            });
            fileInput.click();
        }

        // 语音朗读功能：确保立即重置并播报
        function speakText(text) {
            if (!enableTTS) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 立即取消正在播放或挂起的语音
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'zh-CN';
                    window.speechSynthesis.speak(utterance);
                }, 50);
            }
        }

        // ===================== 转盘绘制与动效 =====================
        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const cx = width / 2;
            const cy = height / 2;
            const radius = width / 2 - 14;

            ctx.clearRect(0, 0, width, height);

            const count = modifiers.length;
            if (count === 0) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                ctx.fillStyle = isDarkMode ? '#1e2129' : '#e2e5ec';
                ctx.fill();
                return;
            }

            const arc = (2 * Math.PI) / count;
            const palette = getCurrentPalette();

            for (let i = 0; i < count; i++) {
                const angle = currentWheelAngle + i * arc;
                const colors = palette[i % palette.length];

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, angle, angle + arc);
                ctx.closePath();
                ctx.fillStyle = colors.bg;
                ctx.fill();

                ctx.strokeStyle = colors.border;
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = colors.text;

                let fontSize = 26;
                if (count > 24) fontSize = 16;
                else if (count > 16) fontSize = 20;
                ctx.font = `bold ${fontSize}px sans-serif`;

                let displayText = modifiers[i].text;
                if (displayText.length > 10) displayText = displayText.substring(0, 9) + '…';
                ctx.fillText(displayText, radius - 24, 0);

                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = isDarkMode ? '#3a404f' : '#b0b8c9';
            ctx.lineWidth = 7;
            ctx.stroke();
        }

        function pickRandomResult() {
            let candidates = modifiers;
            if (antiRepeatLimit > 0) {
                candidates = modifiers.filter(mod => !recentHistory.includes(mod.text));
                if (candidates.length === 0) candidates = modifiers;
            }
            
            let totalWeight = candidates.reduce((sum, m) => sum + (useWeight ? m.weight : 1), 0);
            let r = Math.random() * totalWeight;
            let tMod = candidates[0];
            
            for (let i = 0; i < candidates.length; i++) {
                let currentWeight = useWeight ? candidates[i].weight : 1;
                if (r < currentWeight) {
                    tMod = candidates[i];
                    break;
                }
                r -= currentWeight;
            }

            let modIndex = modifiers.findIndex(m => m.text === tMod.text);
            if (modIndex === -1) modIndex = 0;

            return { tMod, modIndex };
        }

        // 显示结果面板、记录历史与语音播报
        function showAndLogResult(tMod, modIndex) {
            const palette = getCurrentPalette();
            const mEl = document.getElementById('res-modifier');
            const colors = palette[modIndex % palette.length];
            
            mEl.innerText = tMod.text;
            mEl.className = 'modifier-result';
            mEl.style.color = colors.text;
            mEl.style.backgroundColor = colors.bg;
            mEl.style.border = `2px solid ${colors.border}`;

            addHistory(tMod, modIndex);
            speakText(tMod.text); // 执行语音朗读
        }

        function handleRollButtonClick() {
            if (modifiers.length === 0) {
                showToast("⚠️ 词条列表为空，请先在设置中添加");
                return;
            }

            if (!isWheelMode) {
                const { tMod, modIndex } = pickRandomResult();
                showAndLogResult(tMod, modIndex);
            } else {
                const rollBtn = document.getElementById('rollBtn');
                if (wheelState === 'idle') {
                    startWheelSpin();
                } else if (wheelState === 'spinning') {
                    stopWheelSpin();
                }
            }
        }

        function startWheelSpin() {
            wheelState = 'spinning';
            const rollBtn = document.getElementById('rollBtn');
            rollBtn.innerText = 'Stop!!';
            rollBtn.classList.add('btn-stop');

            pendingResult = pickRandomResult();

            spinSpeed = 0.3;
            function spinLoop() {
                if (wheelState === 'spinning') {
                    currentWheelAngle = (currentWheelAngle + spinSpeed) % (2 * Math.PI);
                    drawWheel();
                    animFrameId = requestAnimationFrame(spinLoop);
                }
            }
            spinLoop();
        }

        function stopWheelSpin() {
            wheelState = 'stopping';
            cancelAnimationFrame(animFrameId);
            
            const rollBtn = document.getElementById('rollBtn');
            rollBtn.disabled = true;

            const count = modifiers.length;
            const arc = (2 * Math.PI) / count;
            const targetIndex = pendingResult.modIndex;

            const pointerAngle = 1.5 * Math.PI;
            const targetSectorCenter = targetIndex * arc + arc / 2;
            let finalTargetAngle = pointerAngle - targetSectorCenter;

            const twoPi = 2 * Math.PI;
            currentWheelAngle = ((currentWheelAngle % twoPi) + twoPi) % twoPi;
            finalTargetAngle = ((finalTargetAngle % twoPi) + twoPi) % twoPi;

            let extraSpins = 3 * twoPi;
            let diff = finalTargetAngle - currentWheelAngle;
            if (diff < 0) diff += twoPi;
            let totalDistance = diff + extraSpins;

            let startAngle = currentWheelAngle;
            let startTime = null;
            const duration = 2800;

            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function stopLoop(timestamp) {
                if (!startTime) startTime = timestamp;
                let elapsed = timestamp - startTime;
                let progress = Math.min(elapsed / duration, 1);
                let currentProgress = easeOutCubic(progress);

                currentWheelAngle = startAngle + totalDistance * currentProgress;
                drawWheel();

                if (progress < 1) {
                    animFrameId = requestAnimationFrame(stopLoop);
                } else {
                    currentWheelAngle = startAngle + totalDistance;
                    drawWheel();
                    wheelState = 'idle';

                    rollBtn.disabled = false;
                    rollBtn.innerText = 'Gacha!!';
                    rollBtn.classList.remove('btn-stop');

                    // 转盘彻底停止后，展示结果并朗读
                    showAndLogResult(pendingResult.tMod, pendingResult.modIndex);
                }
            }

            animFrameId = requestAnimationFrame(stopLoop);
        }

        function renderHistoryTable() {
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';
            const palette = getCurrentPalette();

            historyLogs.forEach(record => {
                const tr = document.createElement('tr');
                const colors = palette[record.modIndex % palette.length];
                tr.innerHTML = `
                    <td style="color:var(--text-muted); font-weight:500;">${record.time}</td>
                    <td><span style="display:inline-block; padding:3px 10px; border-radius:6px; background-color:${colors.bg}; color:${colors.text}; border:1px solid ${colors.border}; font-weight:700;">${record.text}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addHistory(m, modIndex) {
            const time = new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
            
            historyLogs.unshift({
                time: time,
                text: m.text,
                modIndex: modIndex
            });

            if (historyLogs.length > 200) {
                historyLogs.pop();
            }

            localStorage.setItem('challenge_history_records_v7', JSON.stringify(historyLogs));
            renderHistoryTable();

            if (antiRepeatLimit > 0) {
                recentHistory.push(m.text);
                if (recentHistory.length > antiRepeatLimit) {
                    recentHistory.shift();
                }
            }
        }

        function clearHistory() { 
            if(confirm("确定清空抽取记录？")) {
                historyLogs = [];
                localStorage.removeItem('challenge_history_records_v7');
                document.getElementById('history-body').innerHTML = '';
                recentHistory = [];
                showToast("🗑️ 抽取记录已全部清空");
            }
        }
        
        function toggleMirror() {
            const currentTransform = document.body.style.transform;
            document.body.style.transform = currentTransform === 'scaleX(-1)' ? 'none' : 'scaleX(-1)';
        }
    </script>
</body>
